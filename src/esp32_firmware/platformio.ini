[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
  adafruit/DHT sensor library@^1.4
  adafruit/Adafruit Unified Sensor@^1.1

; Lädt WIFI_SSID, WIFI_PASSWORD, MQTT_HOST, MQTT_USER und MQTT_PASSWORD
; aus der Datei .env und definiert sie als Makros (siehe load_env.py)
extra_scripts = pre:load_env.py
